services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Charge le même fichier que le service backend : avant, ce service ne
    # lisait POSTGRES_PASSWORD que depuis l'environnement du shell hôte (avec
    # un repli faible "change-me"), potentiellement différent du mot de passe
    # que le backend utilisait réellement pour se connecter — source unique
    # de vérité désormais.
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-innovevent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      # Le contexte racine inclut la photothèque source versionnée ; elle est
      # embarquée dans l'image backend pour initialiser proprement une base vide.
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      # Port 80 est utilisé par le serveur web local de la machine.
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_static:/var/www/static:ro
      - backend_media:/var/www/media:ro

volumes:
  postgres_data:
  backend_static:
  backend_media:
