{% load static %}<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body style="margin:0;padding:0;background:#f0f1f3;font-family:'Segoe UI',Arial,Helvetica,sans-serif;color:#323232;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f0f1f3;padding:36px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:540px;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 8px 28px rgba(30,42,51,0.12);">
          <tr>
            <td style="height:5px;background:#c0272d;line-height:0;font-size:0;">&nbsp;</td>
          </tr>
          <tr>
            <td style="background:#39495b;padding:26px 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="vertical-align:middle;padding-right:12px;">
                    <img src="cid:logo" width="38" height="38" alt="InnovEvent" style="display:block;border-radius:8px;">
                  </td>
                  <td style="vertical-align:middle;">
                    <span style="color:#ffffff;font-size:19px;font-weight:700;letter-spacing:-0.2px;">InnovEvent<span style="color:#f3b9bc;font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:1.5px;margin-left:6px;">Group</span></span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:34px 32px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:18px 32px;background:#fafbfc;border-top:1px solid #e4e7eb;">
              <span style="font-size:11.5px;color:#8a94a0;line-height:1.6;">InnovEvent-GS &mdash; Agence événementielle &amp; ACAMED<br>Cet email est envoyé automatiquement, merci de ne pas y répondre.</span>
            </td>
          </tr>
        </table>
        <p style="font-size:11px;color:#a4acb5;margin:18px 0 0;">&copy; 2026 InnovEvent Group &middot; Douala &middot; Yaoundé &middot; Bafoussam</p>
      </td>
    </tr>
  </table>
</body>
</html>
