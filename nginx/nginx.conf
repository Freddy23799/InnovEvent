# Reverse proxy de développement / recette. En production, ajouter la
# configuration TLS (Let's Encrypt / certbot) et rediriger le port 80 vers 443
# conformément à la section 2 du CDC.
server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Préserve le protocole reçu du reverse proxy TLS de confiance en amont.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /ws/ {
        # Les URL WebSocket portent un jeton d'accès ; ne pas écrire leur
        # query string dans les journaux d'accès.
        access_log off;
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_set_header Host $http_host;
    }

    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $http_host;
    }

    location /health/ {
        proxy_pass http://backend:8000/health/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
