server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le service worker et le manifeste doivent toujours être revérifiés : les
    # mettre en cache longuement bloquerait toute mise à jour de la PWA pour les
    # utilisateurs déjà installés (registerType "autoUpdate" ne sert plus à rien).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        expires off;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        expires off;
    }

    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
